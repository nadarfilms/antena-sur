name: Compilar APK Android TV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle 8.5 y Compilar APK Android TV
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export GRADLE_BIN=$PWD/gradle-8.5/bin/gradle
        
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cd android
        APP_VER=$(grep "versionName" app/build.gradle | awk -F '"' '{print $2}')
        echo "APP_VER=$APP_VER" >> $GITHUB_ENV
        $GRADLE_BIN assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AntenaSur-v${APP_VER}.apk

    - name: Guardar registro de error si falla
      if: failure()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git checkout -B build-logs
        cp gradle_build.log gradle_error.txt || true
        git add gradle_error.txt
        git commit -m "Gradle Error Log" || true
        git push origin build-logs -f || true

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: AntenaSur-AndroidTV
        path: |
          android/app/build/outputs/apk/debug/AntenaSur-v${{ env.APP_VER }}.apk
          android/app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk

    - name: Publicar Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "android/app/build/outputs/apk/debug/AntenaSur-v${{ env.APP_VER }}.apk,android/app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk"
        tag: "v${{ env.APP_VER }}"
        name: "Antena Sur Android TV & Mobile v${{ env.APP_VER }} - Navegación TV Fluida y Catálogo Optimizado"
        body: "Versión ${{ env.APP_VER }}: Navegación espacial determinista 100% fluida para control remoto de Android TV (en cartelera y vista de detalles), 5 columnas en TV, scroll infinito automático y carga garantizada."
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}

