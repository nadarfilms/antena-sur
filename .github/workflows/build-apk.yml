name: Compilar APK Android TV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle 8.5 y Compilar APK Android TV
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export GRADLE_BIN=$PWD/gradle-8.5/bin/gradle
        
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cd android
        $GRADLE_BIN assembleDebug --no-daemon --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: AntenaSur-AndroidTV
        path: android/app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk

    - name: Publicar Release con APK Directo
      uses: ncipollo/release-action@v1
      with:
        artifacts: "android/app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk"
        tag: "v1.0.0"
        name: "Antena Sur Android TV v1.0.0"
        body: "Descarga directa del APK oficial de Antena Sur para Android TV y Google TV."
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
