name: Compilar APK Android TV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle 8.5 y Compilar APK Android TV
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export GRADLE_BIN=$PWD/gradle-8.5/bin/gradle
        
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cd android
        $GRADLE_BIN assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AntenaSur-v1.4.3.apk

    - name: Guardar registro de error si falla
      if: failure()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git checkout -B build-logs
        cp gradle_build.log gradle_error.txt || true
        git add gradle_error.txt
        git commit -m "Gradle Error Log" || true
        git push origin build-logs -f || true

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: AntenaSur-AndroidTV
        path: |
          android/app/build/outputs/apk/debug/AntenaSur-v1.4.3.apk
          android/app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk

    - name: Publicar Release v1.4.3
      uses: ncipollo/release-action@v1
      with:
        artifacts: "android/app/build/outputs/apk/debug/AntenaSur-v1.4.3.apk,android/app/build/outputs/apk/debug/AntenaSur-AndroidTV.apk"
        tag: "v1.4.3"
        name: "Antena Sur Android TV & Mobile v1.4.3 - Motor Híbrido Directo + P2P Cinema VOD"
        body: "Versión 1.4.3: Solución definitiva al problema de carga infinita en Películas y Series. Implementación de Motor Híbrido Multi-Servidor (Servidor 1 2Embed 1080p, Servidor 2 MultiEmbed, Servidor 3 VidSrc PM, y Servidor 4 P2P Torrent) con selector interactivo en el HUD superior y failover automático en 6 segundos. Intercepción nativa de APIs de Cinema en Android APK (MainActivity.java) para funcionamiento 100% autónomo sin daemon local. Corrección integral de navegación remota espacial en Android TV con D-pad (resolución de trampas de foco en detalles y reproductor) y ajuste ergonómico de HUD para televisores 16:9 y 4K."
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}

